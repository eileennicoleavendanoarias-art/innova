services:
  - type: web
    name: innova
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /api/settings
    disk:
      name: innova-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: INNOVA_DATA_DIR
        value: /var/data
      - key: INNOVA_UPLOADS_DIR
        value: /var/data/uploads
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
